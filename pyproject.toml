[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "glider-api"
requires-python = ">=3.8"

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.optional-dependencies]
# Documentation-only tooling (Sphinx + myst-parser). Not needed to build or
# install the package — install with `pip install '.[docs]'` only when
# regenerating the Sphinx documentation.
docs = ["myst-parser>=4.0.1", "Sphinx>=8.2.3"]

[tool.maturin]
features = ["pyo3/extension-module"]
